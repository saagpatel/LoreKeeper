workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - verify
  - test
  - e2e

variables:
  NPM_CONFIG_LOGLEVEL: warn
  CARGO_TERM_COLOR: always
  AST_ENABLE_MR_PIPELINES: "true"

.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

.mr_or_default_rules: &mr_or_default_rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

verify_full:
  stage: verify
  image: rust:1.88-bookworm
  cache: *npm_cache
  before_script:
    - apt-get update
    - apt-get install -y curl libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - npm ci --cache .npm --prefer-offline
    - rustup component add clippy
  script:
    - npm run verify:full
  rules: *mr_or_default_rules

e2e_tests:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  cache: *npm_cache
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days
  rules: *mr_or_default_rules

include:
  # GitLab security jobs expect a test stage by default.
  - template: Jobs/Secret-Detection.gitlab-ci.yml
