name: internal macOS release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-internal-macos:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable @ 2026-10-05
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npm exec playwright install chromium

      - name: Verify internal release candidate
        run: npm run verify:internal-release

      - name: Build internal macOS artifact
        run: npm run release:internal:mac

      - name: Print release manifest
        run: |
          manifest="$(find release-artifacts/internal/macos -name release-manifest.json | head -n 1)"
          if [ -z "$manifest" ]; then
            echo "No release manifest found" >&2
            exit 1
          fi
          echo "Release manifest: $manifest"
          cat "$manifest"

      - name: Upload internal macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lorekeeper-internal-macos
          path: release-artifacts/internal/macos
          if-no-files-found: error
